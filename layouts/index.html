{{ define "main" }}
  <main class="posts">
    <h1>CTF Write-ups</h1>

    <!-- Claude/Terminal kod formatında Dragon və Discord linki -->
    <div style="margin: 20px 0 30px 0; background: #1a1a1a; border: 1px solid #444; padding: 12px 15px; font-family: monospace; font-size: 14px; border-radius: 4px;">
      <span style="color: #888;">// author</span><br>
      <span style="color: #dfd71f; font-weight: bold;">Dragon</span> 
      <span style="color: #666;">@</span> 
      <!-- Yeni, alt xətt olmayan versiya -->
<a href="https://discord.com/users/DzgA8FC3Y" target="_blank" rel="noopener" style="color: #61afef; text-decoration: none;">[ Discord Server ]</a>
    </div>

    {{ range .Site.RegularPages }}
      <article class="post">
        <h2 class="post-title">
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </h2>
        <div class="post-separator"></div>
        <div class="post-date">{{ .Date.Format "2006-01-02" }}</div>
      </article>
    {{ end }}
  </main>
{{ end }}
