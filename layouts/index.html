{{ define "main" }}
  <main class="posts">
    <h1>CTF Write-ups</h1>
    {{ range .Site.RegularPages }}
      <article class="post">
        <h2 class="post-title">
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </h2>
        <div class="post-date">{{ .Date.Format "2006-01-02" }}</div>
      </article>
    {{ end }}
  </main>
{{ end }}
