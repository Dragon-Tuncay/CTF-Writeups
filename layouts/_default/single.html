<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} | CTF Write-ups</title>
  <style>
    body {
      background-color: #0f0f0f;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }
    h1, h2, h3 {
      color: #ffffff;
      border-bottom: 1px dashed #333;
      padding-bottom: 5px;
    }
    a {
      color: #61afef;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .post-date {
      color: #888;
      font-size: 0.9em;
      margin-bottom: 20px;
    }
    code, pre {
      background: #1a1a1a;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #333;
    }
    pre {
      padding: 15px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <p><a href="/">&larr; Ana səhifəyə qayıt</a></p>
  
  <main class="post">
    <h1>{{ .Title }}</h1>
    <div class="post-date">{{ .Date.Format "2006-01-02" }}</div>
    
    <div class="post-content">
      {{ .Content }}
    </div>
  </main>

  <footer style="margin-top: 50px; border-top: 1px solid #333; padding-top: 10px; font-size: 0.8em; color: #666; text-align: center;">
    Keep Hacking | Dr4gon
  </footer>
</body>
</html>
